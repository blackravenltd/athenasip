# The unit suite, under each sanitizer, and the sipp harnesses, on every push and pull request
# (review finding 43). docs/testing.md describes each of these runs by hand.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Debian and Ubuntu ship a Boost older than the 1.87 that boost::redis and boost::mqtt5 need, so it
  # is built as the Dockerfile builds it, and cached.
  BOOST_VERSION: 1.89.0
  BOOST_PREFIX: /opt/boost
  CC: gcc-14
  CXX: g++-14

jobs:
  boost:
    runs-on: ubuntu-24.04
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_PREFIX }}
          key: boost-${{ env.BOOST_VERSION }}-gcc14-ubuntu24.04
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14
          version_underscored="$(echo "${BOOST_VERSION}" | tr '.' '_')"
          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${version_underscored}.tar.gz"
          tar xzf "boost_${version_underscored}.tar.gz"
          cd "boost_${version_underscored}"
          ./bootstrap.sh --with-libraries=thread,json,charconv --with-toolset=gcc
          echo "using gcc : 14 : g++-14 ;" > user-config.jam
          sudo ./b2 -j"$(nproc)" --user-config=user-config.jam toolset=gcc-14 --with-thread --with-json --with-charconv \
            --prefix="${BOOST_PREFIX}" link=shared install

  unit:
    needs: boost
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The suite as a developer runs it, with Redis and MQTT so the two drivers are tested,
          # and with the strict warnings as errors.
          - name: tests
            sanitize: none
            build_type: Debug
            warnings: strict
            werror: "ON"
          - name: asan
            sanitize: address
            build_type: RelWithDebInfo
            warnings: default
            werror: "OFF"
          - name: tsan
            sanitize: thread
            build_type: RelWithDebInfo
            warnings: default
            werror: "OFF"
    name: unit (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.BOOST_PREFIX }}
          key: boost-${{ env.BOOST_VERSION }}-gcc14-ubuntu24.04
          fail-on-cache-miss: true
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 cmake pkg-config libssl-dev libyaml-cpp-dev \
            liblua5.4-dev libnghttp2-dev libgtest-dev redis-server mosquitto
      - name: Redis and MQTT
        run: |
          redis-server --port 6399 --save '' --daemonize yes
          mosquitto -p 1883 -d
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DATHENA_BUILD_TESTING=ON \
            -DATHENA_SANITIZE=${{ matrix.sanitize }} -DATHENA_WARNINGS=${{ matrix.warnings }} -DATHENA_WERROR=${{ matrix.werror }} \
            -DCMAKE_PREFIX_PATH="${BOOST_PREFIX}"
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.BOOST_PREFIX }}/lib
          ATHENA_TEST_REDIS_URL: redis://127.0.0.1:6399
          ATHENA_TEST_MQTT_URL: mqtt://127.0.0.1:1883
          # A data race or a leak fails the run; TSan's reports go to the log.
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ./build/athenasip_tests --gtest_brief=1

  e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        harness:
          - run.sh
          - run.sh --lua
          - run.sh --rtpengine
          - cluster.sh
          - cluster.sh --lua
          - trunk.sh
    name: e2e (${{ matrix.harness }})
    steps:
      - uses: actions/checkout@v4
      # Each harness builds the node image itself (docker compose up --build), Boost from source
      # included, so a run takes a while.
      - run: test/e2e/${{ matrix.harness }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ strategy.job-index }}
          path: test/e2e/results/
