# The node the harness talks to. Everything is in-process: no Redis, no broker.

sip:
  node_id: e2e-node

  # The node's address on the compose network, which sipp can reach.
  public_address: 172.31.0.10

  allow_unencrypted: true

  timers:
    t1_rtt_ms: 500
    t2_max_retransmit_interval_ms: 4000
    t4_network_propagation_ms: 5000
    a_invite_initial: 1
    b_invite_timeout: 64
    d_invite_duration: 64
    e_non_invite_initial: 1
    f_non_invite_timeout: 64
    k_non_invite_duration: 1
    g_server_invite_initial: 1
    h_server_invite_timeout: 64
    i_server_invite_duration: 1
    j_server_non_invite_duration: 64

udp:
  enable: true
  address: 0.0.0.0
  port: 5060

tcp:
  enable: true
  address: 0.0.0.0
  port: 5060

tls:
  enable: false

websocket:
  enable: true
  address: 0.0.0.0
  port: 9500
  tls: false

datastore:
  url: "memory://"

events:
  url: "local://"

media:
  url: "builtin://"

  builtin:
    bind_address: 0.0.0.0
    public_address: 172.31.0.10
    port_min: 22000
    port_max: 23000

http:
  address: 0.0.0.0
  port: 8080

  api:
    enable: true
  files:
    enable: false
