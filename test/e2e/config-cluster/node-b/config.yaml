# node-b of the two-node harness (test/e2e/cluster.sh). The two files differ in the node's
# name and address and in nothing else: one Redis and one broker between them is what makes
# them a cluster.

sip:
  node_id: node-b
  event_prefix: athenasip
  public_address: 172.31.0.11
  allow_unencrypted: true

  timers:
    t1_rtt_ms: 500
    t2_max_retransmit_interval_ms: 4000
    t4_network_propagation_ms: 5000
    a_invite_initial: 1
    b_invite_timeout: 64
    d_invite_duration: 64
    e_non_invite_initial: 1
    f_non_invite_timeout: 64
    k_non_invite_duration: 1
    g_server_invite_initial: 1
    h_server_invite_timeout: 64
    i_server_invite_duration: 1
    j_server_non_invite_duration: 64
    retransmit_max_interval: 8
    retransmit_max_attempts: 7

udp:
  enable: true
  address: 0.0.0.0
  port: 5060

tcp:
  enable: true
  address: 0.0.0.0
  port: 5060

tls:
  enable: false

websocket:
  enable: true
  address: 0.0.0.0
  port: 9500
  tls: false

rtprelay:
  enable: false

# The inter-node listener. The certificates are made by cluster.sh with the node's own
# --ca-init and --ca-node, and name the address below.
cluster:
  enable: true
  address: 0.0.0.0
  port: 5062
  advertise: 172.31.0.11
  ca: /cluster/ca.crt
  cert: /cluster/node-b.crt
  key: /cluster/node-b.key

datastore:
  url: "redis://redis:6379/0"

# A short interval, so each node has heard the other by the time a scenario runs.
events:
  url: "mqtt://mosquitto:1883"
  status_interval: 2

media:
  url: "builtin://"
  builtin:
    bind_address: 0.0.0.0
    public_address: 172.31.0.11
    port_min: 22000
    port_max: 23000

http:
  address: 0.0.0.0
  port: 8080
  api:
    enable: true
  files:
    enable: false
