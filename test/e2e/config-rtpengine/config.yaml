#
# The node the harness talks to, with rtpengine on the media path instead of the builtin
# relay. Everything else matches ../config/config.yaml, so a scenario that fails only here
# is an engine fault.

sip:
  node_id: e2e-node-rtpengine
  event_prefix: athenasip

  # The node's address on the compose network, which sipp can reach.
  public_address: 172.31.0.10

  allow_unencrypted: true

  timers:
    t1_rtt_ms: 500
    t2_max_retransmit_interval_ms: 4000
    t4_network_propagation_ms: 5000
    a_invite_initial: 1
    b_invite_timeout: 64
    d_invite_duration: 64
    e_non_invite_initial: 1
    f_non_invite_timeout: 64
    k_non_invite_duration: 1
    g_server_invite_initial: 1
    h_server_invite_timeout: 64
    i_server_invite_duration: 1
    j_server_non_invite_duration: 64
    retransmit_max_interval: 8
    retransmit_max_attempts: 7

udp:
  enable: true
  address: 0.0.0.0
  port: 5060

tcp:
  enable: true
  address: 0.0.0.0
  port: 5060

tls:
  enable: false

websocket:
  enable: true
  address: 0.0.0.0
  port: 9500
  tls: false

rtprelay:
  enable: false

datastore:
  url: "memory://"

events:
  url: "local://"

media:
  url: "rtpengine://172.31.0.30:22222"

  rtpengine:
    # The engine is on the same bridge, so this only bounds silence.
    timeout_ms: 500
    attempts: 3

http:
  address: 0.0.0.0
  port: 8080

  api:
    enable: true
  files:
    enable: false
