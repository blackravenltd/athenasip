#
# An overlay that puts rtpengine, and coturn, on the interop fixture's media path.
#
#   test/interop/up.sh --rtpengine
#
# The client is a browser on the host or a phone on the LAN, so rtpengine must advertise
# an address that client can send to: --interface takes internal!advertised, and the
# media port range is published to the host.
#
# Port ranges are small, because Docker Desktop publishes wide UDP ranges slowly, and
# must stay clear of 22222 (the ng control port, published on loopback) and 23100-24710
# (bound by the unit suite for the builtin relay). The engine has 22000-22100 and TURN
# 22300-22350.
#
# ATHENA_INTEROP_RTPENGINE_ADVERTISE sets the advertised address. No one address is
# reachable both from the host and from coturn, so browser.sh runs a direct phase
# advertising the public address and a relay phase advertising
# ATHENA_INTEROP_RTPENGINE_ADDRESS, restarting between them.

services:
  coturn:
    image: coturn/coturn:${ATHENA_INTEROP_COTURN_TAG:-4.18.0}
    container_name: ${ATHENA_INTEROP_NAME:-athenasip-interop}-coturn
    volumes:
      - ./generated/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    ports:
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_TURN_PORT:-3478}:3478/udp"
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_TURN_PORT:-3478}:3478/tcp"
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_TURN_MIN:-22300}-${ATHENA_INTEROP_TURN_MAX:-22350}:${ATHENA_INTEROP_TURN_MIN:-22300}-${ATHENA_INTEROP_TURN_MAX:-22350}/udp"
    networks:
      - interop
    healthcheck:
      # The image has neither ss nor netstat, so read /proc: 3478 is 0x0D96.
      test: ["CMD-SHELL", "grep -qi ':0D96' /proc/net/udp"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  rtpengine:
    image: drachtio/rtpengine:latest
    container_name: ${ATHENA_INTEROP_NAME:-athenasip-interop}-rtpengine
    command:
      - rtpengine
      - --interface=${ATHENA_INTEROP_RTPENGINE_ADDRESS:-172.32.0.30}!${ATHENA_INTEROP_RTPENGINE_ADVERTISE:-${ATHENA_INTEROP_PUBLIC_ADDRESS:-127.0.0.1}}
      - --listen-ng=${ATHENA_INTEROP_RTPENGINE_ADDRESS:-172.32.0.30}:22222
      - --port-min=${ATHENA_INTEROP_RTP_MIN:-22000}
      - --port-max=${ATHENA_INTEROP_RTP_MAX:-22100}
      - --foreground
      - --log-stderr
      - --log-level=7
      - --delete-delay=0
    ports:
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_RTP_MIN:-22000}-${ATHENA_INTEROP_RTP_MAX:-22100}:${ATHENA_INTEROP_RTP_MIN:-22000}-${ATHENA_INTEROP_RTP_MAX:-22100}/udp"

      # The ng control port, on loopback only: media-stats.py reads the engine's counters
      # through it, and anything that can reach it can redirect media.
      - "127.0.0.1:${ATHENA_INTEROP_NG_PORT:-22222}:22222/udp"
    networks:
      interop:
        ipv4_address: ${ATHENA_INTEROP_RTPENGINE_ADDRESS:-172.32.0.30}
    healthcheck:
      # ng is UDP only, so check that the control port is bound.
      test: ["CMD-SHELL", "ss -lun | grep -q 22222 || netstat -lun | grep -q 22222"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  athenasip:
    # On the engine's network to reach its ng port. The builtin relay's range is not
    # published: clients send media to rtpengine.
    networks:
      interop:
        ipv4_address: ${ATHENA_INTEROP_NODE_ADDRESS:-172.32.0.10}
    ports: !override
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_SIP_PORT:-5060}:${ATHENA_INTEROP_SIP_PORT:-5060}/udp"
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_SIP_PORT:-5060}:${ATHENA_INTEROP_SIP_PORT:-5060}/tcp"
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_TLS_PORT:-5061}:${ATHENA_INTEROP_TLS_PORT:-5061}/tcp"
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_WS_PORT:-8088}:${ATHENA_INTEROP_WS_PORT:-8088}/tcp"
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_WSS_PORT:-8089}:${ATHENA_INTEROP_WSS_PORT:-8089}/tcp"
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_API_PORT:-8080}:${ATHENA_INTEROP_API_PORT:-8080}/tcp"
    depends_on:
      rtpengine:
        condition: service_healthy
      coturn:
        condition: service_healthy

networks:
  interop:
    name: ${ATHENA_INTEROP_NAME:-athenasip-interop}-net
    ipam:
      config:
        - subnet: ${ATHENA_INTEROP_SUBNET:-172.32.0.0/24}
