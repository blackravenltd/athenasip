# TURN for the interop fixture's relay phase. Rendered by up.sh with the address a client
# can reach, the fixture's ports and a secret generated per run.

listening-port=3478

# The address clients are told to send to: the host's, not the container's.
external-ip=@PUBLIC_ADDRESS@

use-auth-secret
static-auth-secret=@TURN_SECRET@

realm=athenasip.interop

# Narrow, because Docker publishes wide UDP ranges slowly, and clear of the engine's range.
min-port=@TURN_MIN@
max-port=@TURN_MAX@

no-tls
no-dtls
no-cli
log-file=stdout

# At the default level coturn logs nothing about a refused Allocate.
verbose
