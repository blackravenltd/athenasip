#
# TURN for the interop fixture, so the relay path is exercised by the automated browser
# layer rather than by hand. Rendered by up.sh, which fills in the address a client can
# reach and the ports the fixture was given.
#
# The secret is per fixture run rather than fixed: nothing outside the run needs it, and a
# credential that outlives the fixture is one somebody could still relay with.

listening-port=3478

# The address a client is told to send to. A container address is no use to a browser on
# the host.
external-ip=@PUBLIC_ADDRESS@

use-auth-secret
static-auth-secret=@TURN_SECRET@

realm=athenasip.interop

# Narrow, and clear of the engine's own range: Docker publishes wide UDP ranges slowly and
# a fixture needs a handful of calls.
min-port=@TURN_MIN@
max-port=@TURN_MAX@

no-tls
no-dtls
no-cli
log-file=stdout

# Loud, because a refused Allocate says nothing at the default level and the client sees
# only a 400 that looks like a bad secret.
verbose
