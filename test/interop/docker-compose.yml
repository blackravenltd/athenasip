#
# A node for a real SIP client to be pointed at.
#
#   test/interop/up.sh
#
# brings it up and provisions it. Its ports are published to the host, where the client
# under test runs: on loopback by default, or on the LAN (ATHENA_INTEROP_BIND in up.sh).
#
# Ports are published as the node binds them, never translated: the node writes its own
# port into Via and Record-Route.

services:
  athenasip:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: athenasip-interop
    container_name: ${ATHENA_INTEROP_NAME:-athenasip-interop}
    # Creates the fixture's user as the node starts: on memory://, --add-user creates the
    # user and carries on serving. up.sh chooses the password; it goes in on stdin.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s\n' "$$ATHENA_INTEROP_API_PASSWORD" > /tmp/api-password &&
        exec /usr/local/bin/athenasip --add-user "$$ATHENA_INTEROP_API_USER"
        --role manage-admin-users --role manage-realms --role manage-realm-subscribers --role view-cluster-status
        < /tmp/api-password
    environment:
      ATHENA_INTEROP_API_USER: ${ATHENA_INTEROP_API_USER:-interop}
      ATHENA_INTEROP_API_PASSWORD: ${ATHENA_INTEROP_API_PASSWORD:?up.sh sets this}
    volumes:
      - ./generated:/root/.athenasip:ro
      - ${ATHENA_INTEROP_TLS_DIR:-../../tls}:/tls:ro

      # The admin client's build, or the fixture's generated/ when there is none, so the
      # mount always resolves.
      - ${ATHENA_INTEROP_ADMIN_DIR:-./generated}:/admin:ro
    ports:
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_SIP_PORT:-5060}:${ATHENA_INTEROP_SIP_PORT:-5060}/udp"
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_SIP_PORT:-5060}:${ATHENA_INTEROP_SIP_PORT:-5060}/tcp"
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_TLS_PORT:-5061}:${ATHENA_INTEROP_TLS_PORT:-5061}/tcp"
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_WS_PORT:-8088}:${ATHENA_INTEROP_WS_PORT:-8088}/tcp"
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_WSS_PORT:-8089}:${ATHENA_INTEROP_WSS_PORT:-8089}/tcp"
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_API_PORT:-8080}:${ATHENA_INTEROP_API_PORT:-8080}/tcp"

      # The builtin relay's range. Small, because Docker Desktop publishes wide UDP ranges
      # slowly.
      - "${ATHENA_INTEROP_BIND:-127.0.0.1}:${ATHENA_INTEROP_RTP_MIN:-22000}-${ATHENA_INTEROP_RTP_MAX:-22100}:${ATHENA_INTEROP_RTP_MIN:-22000}-${ATHENA_INTEROP_RTP_MAX:-22100}/udp"
    healthcheck:
      # Health is 503 until the datastore is connected.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${ATHENA_INTEROP_API_PORT:-8080}/api/v1/health"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
