#
# An overlay that puts rtpengine on the media path instead of the in-process relay.
#
#   test/e2e/run.sh --rtpengine
#
# runs the same scenarios against it. The rtpengine driver is otherwise only ever
# exercised against a fake socket in the unit tests, which proves what it puts on the
# wire and not that rtpengine agrees with any of it.
#
# Everything stays on the harness bridge, so rtpengine's own address is reachable by
# both the node and sipp and nothing has to be published to the host.

services:
  rtpengine:
    image: drachtio/rtpengine:latest
    container_name: athenasip-e2e-rtpengine
    command:
      - rtpengine
      - --interface=172.31.0.30
      - --listen-ng=172.31.0.30:22222
      - --port-min=23000
      - --port-max=23200
      - --foreground
      - --log-stderr
      - --log-level=7
      - --delete-delay=0
    networks:
      e2e:
        ipv4_address: 172.31.0.30
    healthcheck:
      # rtpengine answers ng over UDP and has no TCP socket to knock on, so the check
      # is that the process is up and the control port is bound.
      test: ["CMD-SHELL", "ss -lun | grep -q 22222 || netstat -lun | grep -q 22222"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  athenasip:
    volumes:
      - ./test/e2e/config-rtpengine:/root/.athenasip:ro
    depends_on:
      rtpengine:
        condition: service_healthy
