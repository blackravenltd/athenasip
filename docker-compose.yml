#
# The quickstart stack, on the canonical backends: Redis for the datastore, Mosquitto
# for the event bus, rtpengine on the media path and coturn as a relay for browsers.
#
#   docker/up.sh          bring it up, seed it, and print what to do next
#   docker/up.sh down     take it down
#   docker/up.sh --reset  take it down and delete the data too
#
# Run up.sh, not `docker compose up`: it renders docker/generated/config.yaml with an
# address clients can reach, waits for health, and provisions a realm, two accounts and
# the first administrator. `docker compose up` works once that config exists.
#
# Ports are published as the node binds them, never translated: the node writes its own
# port into Via and Record-Route.

name: athenasip

services:
  redis:
    networks:
      - athenasip
    image: redis:7-alpine
    container_name: athenasip-redis

    # appendonly keeps registrations, realms, accounts and users across a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30

  mosquitto:
    networks:
      - athenasip
    image: eclipse-mosquitto:2
    container_name: athenasip-mosquitto
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # The broker has no health endpoint, so check that the listener is bound.
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/#' -C 1 -W 2 >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  rtpengine:
    image: drachtio/rtpengine:latest
    container_name: athenasip-rtpengine

    # --interface is `internal!external`: the engine binds its compose-network address,
    # where the node reaches its ng port, and advertises the host's address, which is
    # the one a client can send to. network_mode: host would make the name `rtpengine`
    # unresolvable from the node's container.
    #
    # ATHENA_RTPENGINE_ADVERTISE overrides the advertised address. Setting it to the
    # engine's bridge address exercises a relay-only (TURN) call on a loopback stack;
    # direct clients cannot reach that address.
    command:
      - rtpengine
      - --interface=${ATHENA_RTPENGINE_ADDRESS:-172.33.0.30}!${ATHENA_RTPENGINE_ADVERTISE:-${ATHENA_PUBLIC_ADDRESS:-127.0.0.1}}
      - --listen-ng=0.0.0.0:22222
      - --port-min=${ATHENA_RTP_MIN:-25000}
      - --port-max=${ATHENA_RTP_MAX:-25050}
      - --foreground
      - --log-stderr
      - --log-level=5
      - --delete-delay=0
    networks:
      athenasip:
        ipv4_address: ${ATHENA_RTPENGINE_ADDRESS:-172.33.0.30}
    ports:
      # Media ports. Narrow, because Docker Desktop publishes wide UDP ranges slowly, and
      # clear of 23100-24710, which the unit suite binds for the builtin relay.
      - "${ATHENA_RTP_MIN:-25000}-${ATHENA_RTP_MAX:-25050}:${ATHENA_RTP_MIN:-25000}-${ATHENA_RTP_MAX:-25050}/udp"
    healthcheck:
      test: ["CMD-SHELL", "ss -lun | grep -q 22222 || netstat -lun | grep -q 22222"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  coturn:
    # Pinned so the quickstart is reproducible.
    image: coturn/coturn:${ATHENA_COTURN_TAG:-4.18.0}
    container_name: athenasip-coturn
    volumes:
      - ./docker/generated/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    networks:
      - athenasip
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "${ATHENA_TURN_MIN:-25100}-${ATHENA_TURN_MAX:-25150}:${ATHENA_TURN_MIN:-25100}-${ATHENA_TURN_MAX:-25150}/udp"
    command: ["-c", "/etc/coturn/turnserver.conf"]
    healthcheck:
      # The image has neither ss nor netstat, so read /proc: 3478 is 0x0D96.
      test: ["CMD-SHELL", "grep -qi ':0D96' /proc/net/udp"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  athenasip:
    build:
      context: .
      dockerfile: Dockerfile
    image: athenasip:quickstart
    container_name: athenasip
    networks:
      - athenasip
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      rtpengine:
        condition: service_healthy
    volumes:
      - ./docker/generated:/root/.athenasip:ro

      # up.sh points this at a certificate it signs when the node advertises an address
      # the checked-in one does not name.
      - ${ATHENA_TLS_DIR:-./tls}:/tls:ro

      # The admin console is built in its own repository. up.sh points this at a build
      # when there is one, and otherwise at a directory that exists, with file serving off.
      - ${ATHENA_CONSOLE_DIR:-./docker/generated}:/console:ro
    ports:
      - "${ATHENA_SIP_PORT:-5060}:${ATHENA_SIP_PORT:-5060}/udp"
      - "${ATHENA_SIP_PORT:-5060}:${ATHENA_SIP_PORT:-5060}/tcp"
      - "${ATHENA_TLS_PORT:-5061}:${ATHENA_TLS_PORT:-5061}/tcp"
      - "${ATHENA_WSS_PORT:-9443}:${ATHENA_WSS_PORT:-9443}/tcp"
      - "${ATHENA_API_PORT:-8080}:${ATHENA_API_PORT:-8080}/tcp"
    healthcheck:
      # Health is 503 until the datastore is connected. Seeding waits on this.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${ATHENA_API_PORT:-8080}/api/v1/health"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 2s

networks:
  # A fixed subnet, so rtpengine has a known address to configure the node with.
  athenasip:
    ipam:
      config:
        - subnet: 172.33.0.0/24

volumes:
  redis-data:
  mosquitto-data:
