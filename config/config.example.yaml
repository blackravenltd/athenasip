sip:
  # This must be unique in the cluster
  node_id: sip-0001
  event_prefix: athenasip

  # The address this node tells the outside world to reach it on. A node bound to
  # 0.0.0.0 answers on every address it has and can name none of them to a client, so
  # anything that has to point somebody at this node - GET /api/v1/nodes, and cluster
  # failover later - needs this set. Leave it out on a single-homed host.
  # public_address: 203.0.113.5

  allow_unencrypted: true

  # RFC 4028 section 8: the shortest session interval this node will carry a call on.
  # A caller that asks for less and understands session timers is answered 422 Session
  # Interval Too Small with this value in Min-SE; one that does not understand them has
  # its interval raised to this instead, because a 422 it cannot read would only fail the
  # call. The RFC's own floor is 90 and a lower value here is refused.
  session_min_se: 90

  timers:
    # Base units (milliseconds)
    t1_rtt_ms: 500                     # Default RTT estimate
    t2_max_retransmit_interval_ms: 4000  # RFC default for max backoff cap
    t4_network_propagation_ms: 5000     # Max expected network delay

    # INVITE client transaction
    a_invite_initial: 1                 # A = 1 * T1
    b_invite_timeout: 64               # B = 64 * T1
    d_invite_duration: 64              # D = 64 * T1 (common default; not spec-fixed)

    # Non-INVITE client transaction
    e_non_invite_initial: 1                # E = 1 * T1
    f_non_invite_timeout: 64               # F = 64 * T1
    k_non_invite_duration: 1               # K = 1 * T4

    # INVITE server transaction
    g_server_invite_initial: 1                # G = 1 * T1
    h_server_invite_timeout: 64               # H = 64 * T1
    i_server_invite_duration: 1               # I = 1 * T4

    # Non-INVITE server transaction
    j_server_non_invite_duration: 64          # J = 64 * T1

    # Proxy INVITE (RFC 3261 16.6 step 11). Not a multiple of T1: this one is the
    # proxy's rather than a transaction's, and the RFC requires it to be over 3 minutes.
    # It is what gives up on a callee that rings and then goes silent.
    c_invite_proxy_ms: 240000                 # C = 4 minutes

    # Retransmit cap (optional safety net)
    retransmit_max_interval: 8        # T2 = 8 * T1 (derived from T2 value, capped)
    retransmit_max_attempts: 7        # Approximate exponential retry cap (T1 * 2^6 ~ 32s)

udp:
  enable: true
  address: 0.0.0.0
  port: 5060

tcp:
  enable: true
  address: 0.0.0.0
  port: 5060

tls:
  enable: false
  address: 0.0.0.0
  port: 5061
  cert_pem_filename: "../tls/snakeoil.cer"
  key_pem_filename: "../tls/snakeoil.key"

websocket:
  enable: true
  address: 0.0.0.0
  port: 9500
  # RFC 7118 over TLS. A browser will not open an insecure WebSocket from a page served
  # over https, so a web client needs this; ws:// is for local development. Setting tls
  # without both files is a startup error rather than a silent fall back to ws://.
  tls: false
  # cert_pem_filename: "../tls/snakeoil.cer"
  # key_pem_filename: "../tls/snakeoil.key"

rtprelay:
  enable: true
  address: 0.0.0.0
  public_address: 0.0.0.0
  port_min: 22000
  port_max: 23000

datastore:
  # memory:// keeps everything in this process: no external service, nothing
  # survives a restart. Use redis:// for a cluster or to keep registrations.
  url: "memory://"

events:
  # local:// keeps events inside this process. mqtt:// publishes them to a broker,
  # where they are also how nodes find each other.
  url: "mqtt://127.0.0.1:1883/"

  mqtt:
    client_id: sip-01
    keep_alive: 30

media:
  # builtin:// relays plain RTP from this process and needs nothing else installed.
  # rtpengine://host:port is the production engine, and the one that does WebRTC.
  url: "builtin://"

  # A driver reads the section named after it, for what the URL cannot express. The
  # section is optional: the URL on its own is a working configuration.
  builtin:
    bind_address: 0.0.0.0
    public_address: 0.0.0.0
    port_min: 22000
    port_max: 23000

http:
  address: 0.0.0.0
  port: 8080
  
  api:
    enable: true

    # Bearer tokens, with what each one may do. admin provisions realms and accounts;
    # client reads the node list and who is registered. A request with no matching token
    # is refused, so an API switched on with no tokens is one nobody can call.
    tokens:
      - token: "change-me-admin"
        scopes: [admin]
      - token: "change-me-client"
        scopes: [client]

  files:
    enable: true
    path: "../admin/"

  # websocket
  #   enable: true

