# A working first node. Anything left out takes its default; docs/configuration.md has
# every setting.
#

sip:
  node_id: sip-0001               # unique in the cluster
  # public_address: 203.0.113.5   # needed in a container, behind NAT or a balancer
  # localnet: ["192.168.0.0/16"]
  forward_register: subscribers
  allow_unencrypted: true         # false refuses to start with udp, tcp or plain websocket on
  connect_timeout_ms: 4000
  flow_idle_timeout: 300          # keep above 32 (64 * T1), or UDP transactions lose their flow

  # No BYE comes from an endpoint that lost power. These end such calls; the node never
  # sends a BYE itself (RFC 4028 8.3).
  media_timeout: 300              # too short cuts calls on hold
  session_expires: 1800
  session_min_se: 90
  max_call_duration: 0            # cuts live calls too
  require_session_timer: false    # true fails every call to a client without RFC 4028

  timers:                         # leave alone; a to k are multiples of T1 or T4, not ms
    t1_rtt_ms: 500
    t2_max_retransmit_interval_ms: 4000
    t4_network_propagation_ms: 5000
    a_invite_initial: 1
    b_invite_timeout: 64
    d_invite_duration: 64
    e_non_invite_initial: 1
    f_non_invite_timeout: 64
    k_non_invite_duration: 1
    g_server_invite_initial: 1
    h_server_invite_timeout: 64
    i_server_invite_duration: 1
    j_server_non_invite_duration: 64
    c_invite_proxy_ms: 240000     # milliseconds, and over 180000 (RFC 3261 16.6 step 11)

# A transport with no section is not listened on.
udp:
  enable: true
  address: 0.0.0.0
  port: 5060

tcp:
  enable: true
  address: 0.0.0.0
  port: 5060

tls:
  enable: false
  address: 0.0.0.0
  port: 5061
  cert_pem_filename: "../tls/snakeoil.cer"   # snakeoil: for testing only
  key_pem_filename: "../tls/snakeoil.key"

websocket:
  enable: true
  address: 0.0.0.0
  port: 9500
  tls: false                      # a page served over https can only use wss
  # secure_port: 9443             # wss beside ws, with the tls section's certificate

cluster:                          # needs a redis:// datastore and an mqtt:// bus
  enable: false
  address: 0.0.0.0
  port: 5062
  # advertise: node-a.example.com # the node's certificate must name it
  # ca: /etc/athenasip/cluster/ca.crt
  # cert: /etc/athenasip/cluster/node-a.crt
  # key: /etc/athenasip/cluster/node-a.key

datastore:
  url: "memory://"                # keeps nothing over a restart, and serves one node only

events:
  url: "local://"                 # nodes find each other only over mqtt://
  status_interval: 30
  mqtt:
    keep_alive: 30
    connect_timeout_ms: 5000
    prefix: "athenasip/"

media:
  url: "builtin://"               # WebRTC (ICE, DTLS, SRTP) needs rtpengine://host:2223
  builtin:
    bind_address: 0.0.0.0
    public_address: 127.0.0.1     # not the default: 0.0.0.0, which no endpoint can reach
    port_min: 22000
    port_max: 23000
  rtpengine:
    timeout_ms: 500
    attempts: 3
    # media_address: 203.0.113.9

push:                             # off with no urls
  urls: []                        # e.g. ["apns://", "fcm://", "webpush://"]
  timeout: 10
  refresh: 180                    # a push binding must then ask for at least 240 seconds
  # apns:
  #   key_file: /etc/athenasip/AuthKey_ABC123DEFG.p8
  #   key_id: ABC123DEFG
  #   team_id: DEF123GHIJ
  # fcm:
  #   service_account: /etc/athenasip/firebase-service-account.json
  # webpush:
  #   vapid_private_key: /etc/athenasip/vapid.pem
  #   subject: mailto:admin@example.com

behaviour:                        # a realm can override each over the API
  media_anchor: true              # false leaves media end to end, which fails behind NAT
  media_profile: mirror
  qualify_interval: 0
  rewrite_contact: false

# plugins:
#   path: /usr/local/lib/athenasip/plugins

log:
  level: debug
  format: text

calls:
  history_retention: 2592000

http:
  address: 0.0.0.0
  port: 8080
  tls:                            # browsers give a page no microphone over plain http
    enable: false
    port: 8443
  api:
    enable: true                  # no tokens: make the first admin with athenasip --add-user
    rate_limits:
      open: { burst: 30, per_minute: 30 }
      login_source: { burst: 10, per_minute: 5 }
      login_user: { burst: 5, per_minute: 1 }
      session: { burst: 60, per_minute: 300 }
    session_lifetime: 43200
    session_idle: 3600
    # ice_servers:
    #   - url: "stun:stun.example.com:3478"
    #   - url: "turn:turn.example.com:3478"
    # turn_shared_secret: ""      # coturn's static-auth-secret; a turn: URL gets no credential without it
    turn_credential_ttl: 3600
  files:
    enable: true
    path: "../admin/"
    spa: true
