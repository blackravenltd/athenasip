athenasip:
  config_name: 'Single Node Demo'
  data_store: 'redis'               # [database|redis]
  event_system: 'mqtt'              # [local|mqtt|redis]

sip:
  allow_unencrypted: true

  timers:
    # Base units (milliseconds)
    t1_rtt_ms: 500                     # Default RTT estimate
    t2_max_retransmit_interval_ms: 4000  # RFC default for max backoff cap
    t4_network_propagation_ms: 5000     # Max expected network delay

    # INVITE client transaction
    a_invite_initial: 1                 # A = 1 * T1
    b_invite_timeout: 64               # B = 64 * T1
    d_invite_duration: 64              # D = 64 * T1 (common default; not spec-fixed)

    # Non-INVITE client transaction
    e_non_invite_initial: 1                # E = 1 * T1
    f_non_invite_timeout: 64               # F = 64 * T1
    k_non_invite_duration: 1               # K = 1 * T4

    # INVITE server transaction
    g_server_invite_initial: 1                # G = 1 * T1
    h_server_invite_timeout: 64               # H = 64 * T1
    i_server_invite_duration: 1               # I = 1 * T4

    # Retransmit cap (optional safety net)
    retransmit_max_interval: 8        # T2 = 8 * T1 (derived from T2 value, capped)
    retransmit_max_attempts: 7        # Approximate exponential retry cap (T1 * 2^6 ~ 32s)

udp:
  enable: true
  address: 0.0.0.0
  port: 5060

tcp:
  enable: true
  address: 0.0.0.0
  port: 5060

tls:
  enable: true
  address: 0.0.0.0
  port: 5061
  cert_pem_filename: "../tls/snakeoil.cer"
  key_pem_filename: "../tls/snakeoil.key"

websocket:
  enable: true
  address: 0.0.0.0
  port: 9500

rtprelay:
  enable: true
  address: 0.0.0.0
  public_address: 0.0.0.0
  port_min: 22000
  port_max: 23000

database:
  # MySQL
  url: "mysql://root:wbv8g8nfzsc@localhost/athenasip"
  # SQLite
  #url: "sqlite://localhost/~/.athenasip/athena.sqlite"

redis:

mqtt:
  broker_host: 'localhost'
  broker_port: 1883
  client_id: 'athenasip'
  username: 'root'
  password: ''
  keep_alive_seconds: 3 

http:
  address: 0.0.0.0
  port: 8080
  
  api:
    enable: true

  files:
    enable: true
    path: "../admin/"

  # websocket
  #   enable: true

scripting:
  language: lua     # 'lua' is the default
  add_stdlib: true
  allowed_path: /
  routing_script: ~/.athenasip/routing.lua