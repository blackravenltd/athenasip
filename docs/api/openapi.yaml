openapi: 3.0.3

info:
  title: AthenaSIP Admin API
  version: "1.0.0"
  description: |
    Provisioning and read-only status for one AthenaSIP node.

    The one credential is a **session token** from `POST /auth/login`. Each route needs
    any one of the roles it names. Roles are read on every request, so a change takes
    effect on the next one.

    There are no configured tokens. The first administrator is made on the node's host
    with `athenasip --add-user`, which is also the way back in when every password is
    lost.

    Refusals, and what a client does with each:

    - `401`: the credential is absent or no longer good (unknown token, expired session,
      disabled user). Sign in again.
    - `403`: the credential is good and does not hold a role the route needs. Do not
      sign out.
    - `503`: the datastore did not answer, so the node cannot tell. Retry.
    - `429`: rate limited. Wait the seconds in `Retry-After` and retry. Do not sign out.

    Rate limits are per node:

    | Who | Keyed by | Burst | Then |
    | --- | --- | --- | --- |
    | Open routes, unknown endpoints, and any credential that does not resolve | source address | 30 | 30 a minute |
    | `POST /auth/login`, on top of that | source address | 10 | 5 a minute |
    | `POST /auth/login`, on top of that | username | 5 | 1 a minute |
    | A signed-in caller | session | 60 | 300 a minute |

    These are the defaults; `http.api.rate_limits` sets them. The login limits count
    every attempt, not only failures. The source address is the peer of the connection,
    so a node behind a reverse proxy sees every caller as the proxy.
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://{host}:{port}/api/v1
    description: A node's admin listener, as configured under `http` in config.yaml
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "8080"

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Logging in, logging out, and asking who you are
  - name: users
    description: The users that administer this node, which are not subscribers
  - name: status
    description: What this node is and whether it is serving
  - name: realms
    description: The SIP domains this node serves
  - name: subscribers
    description: The subscribers within a realm
  - name: registrations
    description: Where subscribers are currently reachable
  - name: calls
    description: What the node is carrying now, and what its media engine relayed for it
  - name: media
    description: The media engine and the node's counters

paths:
  /health:
    get:
      operationId: getHealth
      tags: [status]
      summary: Whether this node is serving
      description: |
        Open, with no token, for healthchecks and load balancers.

        `503` when the datastore is not connected.
      security: []
      responses:
        "200":
          description: Serving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not serving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange a username and password for a session token
      description: |
        Open, with no credential.

        The token is given out once and cannot be retrieved again; the node stores only
        its SHA-256.

        An unknown user, a wrong password, an empty password and a disabled user are all
        the same `401`, so the answer does not reveal who exists. A missing field is a
        `400`.

        A user holding no roles may log in and is told it holds none.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The username or password is not right, or the user is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the presented session
      description: |
        `204` whether or not the token named a live session, so the answer does not
        reveal whether a token is real.

        Only the session presented ends. `DELETE /users/{user}/sessions` ends all of a
        user's sessions.
      security: []
      responses:
        "204":
          description: Gone
        "401":
          description: No bearer token was presented, so there was nothing to end
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Who this credential is and what roles it holds
      description: |
        Any signed-in user, holding any roles or none.

        Roles are resolved on this request, so this is how a client notices that its
        permissions have changed.
      responses:
        "200":
          description: Who you are
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /nodes:
    get:
      operationId: listNodes
      tags: [status]
      summary: The cluster as this node knows it
      description: |
        One entry per node, each with a URI per enabled SIP transport. A client reads
        this to learn where else the realm is served, which lets a browser fail over
        without DNS SRV.

        This node is first, marked `self`, described from its own configuration. Every
        other node is listed as it last described itself on the event bus (its retained
        `nodes/<id>/status` message). A node whose report is older than three status
        intervals is marked `stale` and must not be routed to. A node the broker
        reported `down` is listed as down.

        The address is `sip.public_address` when set, otherwise the address the listener
        is bound to, which for `0.0.0.0` is unusable to a client.
      responses:
        "200":
          description: The nodes serving this realm
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /client/config:
    get:
      tags: [status]
      operationId: getClientConfig
      summary: Everything a web client needs that it cannot be told by hand
      description: |
        What a browser needs to place a call: where to signal and what to use for ICE.

        `websocket_uri` is the secure WebSocket listener. It is **absent** when this node
        has no `wss` listener, because a page served over https cannot open `ws://`.

        `ice_servers` is shaped as `RTCIceServer` and can be handed to `RTCPeerConnection`
        unchanged. A `turn:` entry carries a credential minted for this request under the
        coturn shared-secret scheme, which expires on its own. It carries none when the
        node has no `http.api.turn_shared_secret`. A `stun:` entry never carries one.

        Needs the same role as `/nodes`.
      responses:
        "200":
          description: What to use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /realms:
    get:
      operationId: listRealms
      tags: [realms]
      summary: Every realm this node serves
      responses:
        "200":
          description: The realms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Realm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createRealm
      tags: [realms]
      summary: Create a realm
      description: |
        `409` when the realm already exists; it is never overwritten.

        `nonce_secret` is generated when not given, and no endpoint returns it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealmCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Realm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /realms/{realm}:
    parameters:
      - $ref: "#/components/parameters/Realm"
    get:
      operationId: getRealm
      tags: [realms]
      summary: One realm
      responses:
        "200":
          description: The realm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Realm"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRealm
      tags: [realms]
      summary: Update a realm
      description: |
        Only the fields given are changed. A field left out is left alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealmUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Realm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRealm
      tags: [realms]
      summary: Delete a realm
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /realms/{realm}/subscribers:
    parameters:
      - $ref: "#/components/parameters/Realm"
    get:
      operationId: listSubscribers
      tags: [subscribers]
      summary: Every subscriber in a realm
      responses:
        "200":
          description: The subscribers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscriber"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createSubscriber
      tags: [subscribers]
      summary: Create a subscriber
      description: |
        Give a `password` and the server stores only its HA1 (RFC 2617: the hash of
        user, realm and password), which no endpoint returns. `ha1` is accepted instead,
        for importing subscribers.

        The subscriber id is derived from its URI, so every node agrees on it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriberCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscriber"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /realms/{realm}/subscribers/{user}:
    parameters:
      - $ref: "#/components/parameters/Realm"
      - $ref: "#/components/parameters/User"
    get:
      operationId: getSubscriber
      tags: [subscribers]
      summary: One subscriber
      responses:
        "200":
          description: The subscriber
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscriber"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateSubscriber
      tags: [subscribers]
      summary: Change a subscriber's credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscriber"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSubscriber
      tags: [subscribers]
      summary: Delete a subscriber
      description: Its registrations go with it.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /registrations:
    get:
      operationId: listRegistrations
      tags: [registrations]
      summary: Where subscribers are currently reachable
      description: |
        Read only. A binding is written by a REGISTER and by nothing else.

        `flow_id` and `node_id` are the cluster half of a binding: which connection it
        was learned over (RFC 5626) and which node holds that connection. Both are empty
        on a single node.
      parameters:
        - name: realm
          in: query
          required: false
          schema:
            type: string
          description: Only this realm's registrations. Every realm when it is left out.
      responses:
        "200":
          description: The registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /calls:
    get:
      operationId: listCalls
      tags: [calls]
      summary: The calls this node is carrying now
      description: |
        Live calls only. A call that has ended is gone from this list and is on
        `/call-records`.

        `media` is null for a call nothing anchors: the realm does not anchor, or the
        node has no media engine. Otherwise it is what the engine reports, cumulative
        since the call began. Each leg is one end of one stream, counted at the engine:
        `_in` is what arrived from that end and `_out` what the engine sent it. A
        direction the engine does not report is absent, never zero. `participant` is
        always null: the engine knows a leg by its packets' source address, not by
        participant.
      responses:
        "200":
          description: The live calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /call-records:
    get:
      operationId: listCallRecords
      tags: [calls]
      summary: The calls that have ended
      description: |
        One record per call, newest first, read from the datastore, so every node of a
        cluster gives the same list. The node the caller reached writes the record; a
        node the call was forwarded to is named in `nodes`. A call that never reached a
        dialog has no record.

        Records are kept for `calls.history_retention` seconds, thirty days by default.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: The records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /calls/{call}:
    parameters:
      - name: call
        in: path
        required: true
        schema:
          type: string
        description: |
          The Call-ID, percent-encoded. RFC 3261 lets a Call-ID hold `@` and `/`, and an
          encoded `/` (`%2F`) is one path segment, not two.
        example: a84b4c76e66710%40pc33.atlanta.com
    get:
      operationId: getCall
      tags: [calls]
      summary: One live call
      responses:
        "200":
          description: The call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /media:
    get:
      operationId: getMediaEngine
      tags: [media]
      summary: The media engine and what it can do
      description: Its name and capabilities, never its URL, which can carry an address and credentials.
      responses:
        "200":
          description: The engine, or null fields when the node has none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaEngine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /media/reoffers:
    get:
      operationId: listMediaReoffers
      tags: [media]
      summary: Subscribers that refused the media profile they were offered
      description: |
        When a callee answers an offer this node's engine produced with 488 Not Acceptable
        Here, the node offers it the other profile once (WebRTC for plain RTP and back).
        This lists each subscriber that needed that, on this node since it started, most
        recent first. `suggested_media_profile` is the value to set as the subscriber's
        `behaviour.media_profile`; the node does not set it.
      responses:
        "200":
          description: The re-offers, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaReoffer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /qualify:
    get:
      operationId: listQualifiedClients
      tags: [media]
      summary: Registered clients this node is probing with OPTIONS
      description: |
        Per node: only the node holding a client's flow can probe it. Each entry says how
        often the client is probed, when it last answered, how many probes in a row went
        unanswered, and what media it said it takes if its answer carried a session
        description (RFC 3261 11.2), in the words `behaviour.media_profile` uses.
      responses:
        "200":
          description: The probed clients
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [subscriber, contact, interval, answered_at, unanswered, said_media_profile]
                  properties:
                    subscriber:
                      type: string
                    contact:
                      type: string
                    interval:
                      type: integer
                    answered_at:
                      type: string
                      format: date-time
                      nullable: true
                    unanswered:
                      type: integer
                    said_media_profile:
                      type: string
                      nullable: true
                      enum: [rtp, webrtc, srtp, null]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /metrics:
    servers:
      - url: http://{host}:{port}
        variables:
          host:
            default: localhost
          port:
            default: "8080"
    get:
      operationId: getMetrics
      tags: [media]
      summary: Counters for a monitoring system
      description: |
        Prometheus text exposition format 0.0.4, on the admin port and outside `/api/v1`.

        - `athenasip_calls_active` (gauge)
        - `athenasip_dialogs_active` (gauge)
        - `athenasip_channels_open{transport}` (gauge), each flow counted once
        - `athenasip_transactions_active` (gauge)
        - `athenasip_media_packets_relayed_total` (counter), only when the media engine
          can count; absent rather than zero when it cannot
      responses:
        "200":
          description: The counters
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Every user that can administer this node
      description: Needs `manage-admin-users`. A password never appears in any of these answers.
      responses:
        "200":
          description: The users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      description: |
        Needs `manage-admin-users`. The first user on a fresh node is made on the host
        with `athenasip --add-user`.

        `409` when the username is taken. Usernames are case-folded: `Tom` and `tom`
        cannot both exist, either spelling logs in, and the spelling given is kept for
        display.

        `400 unknown_role` for a role this build does not have.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /users/{user}:
    parameters:
      - $ref: "#/components/parameters/Username"
    get:
      operationId: getUser
      tags: [users]
      summary: One user
      description: Needs `manage-admin-users`.
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateUser
      tags: [users]
      summary: Change a user
      description: |
        Needs `manage-admin-users`. The username cannot be changed, and the password has
        its own endpoint.

        A field not given is left alone. `roles` given as `[]` takes them all away.

        `409 would_lock_out` when a user tries to disable itself or take
        `manage-admin-users` away from itself. Another holder of the role may still do
        either, and a node left with no administrators is recovered with
        `athenasip --add-user` on the host.

        Disabling a user revokes every session it held.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The change would lock the caller out of its own user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      description: |
        Needs `manage-admin-users`. `204` with no body, `404` when there is no such user.

        Deleting a user revokes its sessions.

        `409 would_lock_out` when a user tries to delete itself.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A user cannot delete itself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /users/{user}/password:
    parameters:
      - $ref: "#/components/parameters/Username"
    post:
      operationId: setPassword
      tags: [users]
      summary: Set a password
      description: |
        Any authenticated caller may set its own password. Setting another user's needs
        `manage-admin-users`.

        `old_password` is required only when the caller does **not** hold
        `manage-admin-users`. A holder of that role sets any password, its own included,
        without the old one.

        **This ends every session that user held, including the one that asked.** A
        client changing its own password must sign in again.

        A wrong or missing `old_password` is `403 wrong_password`, not `401`: the bearer
        is still good, and a client must not treat it as the session ending.

        Somebody else's password without the role is `403` whether or not the user
        exists. With the role, an unknown user is `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed, and every session that user held is gone
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the caller does not hold `manage-admin-users` and the `old_password`
            for its own user was wrong or missing (`wrong_password`), or this is
            somebody else's password and the caller does not hold the role (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /users/{user}/sessions:
    parameters:
      - $ref: "#/components/parameters/Username"
    delete:
      operationId: revokeSessions
      tags: [users]
      summary: Sign a user out everywhere
      description: |
        Needs `manage-admin-users`. Revokes every session that user holds; the user can
        log in again.

        `204` even when the user held none; `404` only when there is no such user.
      responses:
        "204":
          description: Every session that user held is gone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A session token from `POST /auth/login`: 32 bytes from a CSPRNG as 64 hex
        characters. It is given out once; the node stores only its SHA-256.

  parameters:
    Realm:
      name: realm
      in: path
      required: true
      schema:
        type: string
      description: The realm name, which is the SIP domain.
      example: example.com
    Username:
      name: user
      in: path
      required: true
      schema:
        type: string
      description: |
        An administrator's username, matched case-insensitively. Not a subscriber: see the
        `users` tag.
      example: tom
    User:
      name: user
      in: path
      required: true
      schema:
        type: string
      description: |
        The user part of the subscriber's SIP URI, percent-encoded. A user containing an `@`
        or a `/` is one path segment, not two.
      example: alice

  responses:
    BadRequest:
      description: The request was not one this API understands
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No token, or not one this node knows
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited. Wait the seconds in Retry-After; the credential, if any, is still good.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until a request would be let through
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        A good credential that does not hold a role this endpoint needs. Not a reason
        to sign the user out.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such realm or subscriber
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: It already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: |
        The datastore did not answer, so the node cannot tell whether the credential is
        good. Retry; never a reason to sign a user out.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ClientConfig:
      type: object
      required: [transports, ice_servers]
      properties:
        websocket_uri:
          type: string
          description: |
            The secure WebSocket to signal over. Absent when this node has no `wss`
            listener.
          example: wss://203.0.113.5:9443
        transports:
          type: array
          description: Every SIP transport this node serves, the same list `/nodes` gives.
          items:
            $ref: "#/components/schemas/NodeTransport"
        ice_servers:
          type: array
          description: Shaped as `RTCIceServer`, to be handed to `RTCPeerConnection` unchanged.
          items:
            type: object
            required: [urls]
            properties:
              urls:
                type: string
                example: turn:turn.example.com:3478
              username:
                type: string
                description: |
                  Present for a `turn:` entry when a shared secret is configured: the
                  credential's expiry in Unix seconds, optionally followed by a name.
              credential:
                type: string
                description: Present with `username`. base64 of HMAC-SHA1 over it.
              expires_at:
                type: integer
                format: int64
                description: Unix seconds. The credential stops working by itself.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Matched case-insensitively
        password:
          type: string
          format: password
      example:
        username: tom
        password: a long enough password

    LoginResponse:
      type: object
      required: [token, expires_at, roles]
      properties:
        token:
          type: string
          description: |
            64 hex characters. Given out here once and never retrievable again.
        expires_at:
          type: integer
          format: int64
          description: |
            Unix seconds, from `http.api.session_lifetime`. The session also ends after
            `http.api.session_idle` seconds without use, which is not reported here.
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          description: Empty for a user that holds none
      example:
        token: 3f9a1c7e2b8d4056a1c3e5f70981b2d4c6e8fa0b1d3f5a7e9920c4e6a8b0d2f41
        expires_at: 1790506751
        roles: [manage-realms]

    Session:
      type: object
      required: [kind, roles]
      description: |
        Who a credential is. `kind` is always `user`.
      properties:
        kind:
          type: string
          enum: [user]
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        username:
          type: string
          description: In the spelling the user was created with
        display_name:
          type: string
          description: May be empty
        expires_at:
          type: integer
          format: int64
          description: Unix seconds
      example:
        kind: user
        username: Tom
        display_name: Tom Cully
        roles: [manage-realms, view-cluster-status]
        expires_at: 1790506751

    Role:
      type: string
      description: |
        A permission, not a rank. No role implies another, and no role covers
        everything.
      enum:
        - view-cluster-status
        - manage-admin-users
        - manage-realms
        - manage-realm-subscribers
        - manage-cluster

    User:
      type: object
      description: |
        A user administers this node. It is not a subscriber: a subscriber belongs to a
        realm, makes and receives calls and authenticates with Digest. Neither credential
        works as the other.
      properties:
        username:
          type: string
          description: As it was given, not the case-folded key it is filed under
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
          description: A disabled user cannot log in and holds no sessions
        created_at:
          type: integer
          format: int64
          description: Unix seconds
        last_login_at:
          type: integer
          format: int64
          description: Unix seconds, `0` for a user that has never logged in
      example:
        username: Tom
        display_name: Tom Cully
        roles: [manage-admin-users]
        disabled: false
        created_at: 1790522442
        last_login_at: 0

    UserCreate:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          description: Absent means none; such a user may log in and do nothing

    UserUpdate:
      type: object
      description: |
        Every field is optional and one that is not given is left alone. `roles` given as
        `[]` takes them all away.
      properties:
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        disabled:
          type: boolean

    PasswordChange:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
        old_password:
          type: string
          format: password
          description: |
            Required when changing your own password without holding
            `manage-admin-users`. Ignored when you hold it.

    Error:
      type: object
      required: [error]
      description: |
        One shape for every failure. `code` is stable and is what a client branches on;
        `message` is for a person.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_json
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - method_not_allowed
                - conflict
                - datastore_error
                - unavailable
                - unknown_role
                - would_lock_out
                - wrong_password
            message:
              type: string
      example:
        error:
          code: conflict
          message: realm example.com already exists

    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        node:
          type: string
          description: This node's `sip.node_id`
        version:
          type: string
        datastore:
          type: string
          description: The datastore driver and its version, as it describes itself
      example:
        status: ok
        node: sip-0001
        version: 0.4.0
        datastore: memory 0.0.1

    Node:
      type: object
      properties:
        id:
          type: string
        self:
          type: boolean
          description: Whether this is the node that answered
        status:
          type: string
          enum: [ok, degraded, stopped, down]
        stale:
          type: boolean
          description: Absent for this node; true when the node's report is more than three status intervals old
        version:
          type: string
        at:
          type: string
          description: When the node composed its report; absent for this node
        transports:
          type: array
          items:
            $ref: "#/components/schemas/NodeTransport"
        cluster:
          type: object
          description: |
            Where a peer node reaches this one's inter-node listener. Absent for this node,
            for a node that is not in a cluster, and in the list `/client/config` gives a
            client.
          properties:
            address:
              type: string
            port:
              type: integer
      example:
        id: sip-0001
        self: true
        transports:
          - transport: wss
            address: 203.0.113.5
            port: 9500
            uri: sips:203.0.113.5:9500;transport=wss

    NodeTransport:
      type: object
      properties:
        transport:
          type: string
          enum: [udp, tcp, tls, ws, wss]
        address:
          type: string
        port:
          type: integer
        uri:
          type: string
          description: The SIP URI a client would use for this transport

    Realm:
      type: object
      properties:
        name:
          type: string
        id:
          type: integer
          format: int64
        nonce_expiry:
          type: integer
          description: How long a Digest nonce stays good, in seconds
        registration_timeout:
          type: integer
          description: The longest registration this realm grants, in seconds
        registration_minimum:
          type: integer
          description: >-
            The shortest registration this realm accepts, in seconds. Zero, the default,
            accepts any. A shorter one is refused with 423 Interval Too Brief carrying
            this value in Min-Expires (RFC 3261 10.3).
        behaviour:
          $ref: '#/components/schemas/Behaviour'
        behaviour_effective:
          $ref: '#/components/schemas/BehaviourEffective'
        behaviour_default:
          $ref: '#/components/schemas/BehaviourEffective'

    Behaviour:
      type: object
      description: >-
        What a realm does differently from the server's behaviour section. A setting
        that is null, or absent, is inherited from the server; null in an update puts
        a setting back to inheriting. An unknown setting or value is a 400 and changes
        nothing.
      additionalProperties: false
      properties:
        media_anchor:
          type: boolean
          nullable: true
          description: >-
            Whether this node puts itself in the media path when a media engine is
            configured. False leaves every session description untouched and the media
            goes end to end (RFC 3261 16.6), which is right for two endpoints that can
            reach each other and wrong for anything behind a NAT.
        media_profile:
          type: string
          nullable: true
          enum: [mirror, transport, rtp, webrtc, srtp, null]
          description: >-
            What the engine is asked to produce for a leg that has not said what it
            speaks; a leg that has is answered in kind. mirror offers a callee what the
            caller offered. transport makes ws and wss WebRTC and everything else plain
            RTP. rtp, webrtc and srtp (RFC 4568 keys in the description) make every leg
            that.
        qualify_interval:
          type: integer
          nullable: true
          description: >-
            Seconds between OPTIONS to each client registered in this realm, down the flow
            it registered on; 0 for never, otherwise 5 to 86400. A client that answers with
            a session description (RFC 3261 11.2) has said what media it takes.
        rewrite_contact:
          type: boolean
          nullable: true
          description: >-
            Rewrite the Contact in each request and response this node forwards to the
            address and port the message came from (Asterisk's rewrite_contact). WebSocket
            clients are never rewritten.

    BehaviourEffective:
      type: object
      description: >-
        A complete behaviour: in behaviour_effective, what the realm's comes to on the node
        that answered; in behaviour_default, that node's server default on its own.
      properties:
        media_anchor:
          type: boolean
        media_profile:
          type: string
          enum: [mirror, transport, rtp, webrtc, srtp]
        qualify_interval:
          type: integer
        rewrite_contact:
          type: boolean

    RealmCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        nonce_secret:
          type: string
          description: Generated when it is not given, and never returned
        nonce_expiry:
          type: integer
        registration_timeout:
          type: integer
        registration_minimum:
          type: integer
        behaviour:
          $ref: '#/components/schemas/Behaviour'

    RealmUpdate:
      type: object
      properties:
        nonce_secret:
          type: string
        nonce_expiry:
          type: integer
        registration_timeout:
          type: integer
        registration_minimum:
          type: integer
        behaviour:
          $ref: '#/components/schemas/Behaviour'

    CallRecord:
      type: object
      required: [id, created_at, answered_at, ended_at, duration, caller, callee, nodes, media_engine]
      properties:
        id:
          type: string
          description: The Call-ID
        created_at:
          type: string
          nullable: true
        answered_at:
          type: string
          nullable: true
          description: Null for a call nobody answered
        ended_at:
          type: string
          nullable: true
        duration:
          type: integer
          description: Seconds between the answer and the end; zero for a call nobody answered
        caller:
          type: string
          nullable: true
        callee:
          type: string
          nullable: true
        nodes:
          type: array
          description: The nodes that carried the call, the caller's first
          items:
            type: string
        media_engine:
          type: string
          nullable: true
          description: The engine that anchored the media; null when nothing did

    Subscriber:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Derived from the URI, so every node agrees on it
        uri:
          type: string
        user:
          type: string
        realm:
          type: string
        behaviour:
          $ref: '#/components/schemas/SubscriberBehaviour'
      example:
        id: 11400714819323198485
        uri: sip:alice@example.com
        user: alice
        realm: example.com
        behaviour:
          media_profile: null

    MediaReoffer:
      type: object
      required: [subscriber, rejected, took, count, last_at, suggested_media_profile]
      properties:
        subscriber:
          type: string
          description: The Request-URI the call was for, which is the subscriber's address of record
        rejected:
          type: string
          enum: [rtp, webrtc]
        took:
          type: string
          nullable: true
          enum: [rtp, webrtc, null]
          description: Null when the other profile was refused as well
        count:
          type: integer
        last_at:
          type: string
          format: date-time
        suggested_media_profile:
          type: string
          nullable: true
          enum: [rtp, webrtc, null]

    SubscriberBehaviour:
      type: object
      description: >-
        The one behaviour setting that is about an endpoint rather than a realm. Null, or
        absent, takes the realm's; null in an update goes back to it. Any other setting, or
        an unknown value, is a 400 and changes nothing.
      additionalProperties: false
      properties:
        media_profile:
          type: string
          nullable: true
          enum: [mirror, transport, rtp, webrtc, srtp, null]
          description: >-
            What this subscriber's endpoint is, as Asterisk's webrtc=yes says. It decides the
            first description produced towards the endpoint, above the realm's behaviour
            and below what the endpoint has itself said in an offer or answer.

    SubscriberCreate:
      type: object
      required: [user]
      description: One of `password` or `ha1` is required.
      properties:
        user:
          type: string
        password:
          type: string
          description: Turned into HA1 here and not stored
        ha1:
          type: string
          description: For importing a subscriber that already has one
        behaviour:
          $ref: '#/components/schemas/SubscriberBehaviour'

    SubscriberUpdate:
      type: object
      description: Any of `password` or `ha1`, and `behaviour`.
      properties:
        password:
          type: string
        ha1:
          type: string
        behaviour:
          $ref: '#/components/schemas/SubscriberBehaviour'

    Call:
      type: object
      required: [id, state, created_at, answered_at, participants, media]
      properties:
        id:
          type: string
          description: The Call-ID
        state:
          type: string
          enum: [Initial, Trying, Ringing, Connected, Closing, Closed]
        created_at:
          type: string
          format: date-time
          nullable: true
        answered_at:
          type: string
          format: date-time
          nullable: true
        participants:
          type: array
          items:
            $ref: "#/components/schemas/CallParticipant"
        media:
          allOf:
            - $ref: "#/components/schemas/CallMedia"
          nullable: true

    CallParticipant:
      type: object
      required: [identity, originator, profile]
      properties:
        identity:
          type: string
          description: The participant's SIP URI
        originator:
          type: boolean
        profile:
          type: string
          enum: [webrtc, plain-rtp, srtp-sdes]
          nullable: true
          description: What the leg's own session description said it is, null until it has said

    CallMedia:
      type: object
      required: [engine, idle_seconds, legs]
      properties:
        engine:
          type: string
          example: rtpengine
        idle_seconds:
          type: integer
          nullable: true
          description: How long all of the call's media has been silent
        legs:
          type: array
          items:
            $ref: "#/components/schemas/CallLeg"

    CallLeg:
      type: object
      required: [participant]
      properties:
        participant:
          type: integer
          nullable: true
          description: Always null; see listCalls
        packets_in:
          type: integer
        bytes_in:
          type: integer
        packets_out:
          type: integer
        bytes_out:
          type: integer

    MediaEngine:
      type: object
      required: [engine, connected, capabilities]
      properties:
        engine:
          type: string
          nullable: true
          example: builtin
        connected:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
            enum: [bridge, conference, record, transcode]

    Registration:
      type: object
      properties:
        subscriber:
          type: string
          description: The subscriber's URI
        subscriber_id:
          type: integer
          format: int64
        contact:
          type: string
        registered_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        nat:
          type: boolean
          description: The contact is on a private address, so replies go back down the flow
        node_id:
          type: string
          description: Which node holds the flow. Empty on a single node
        flow_id:
          type: string
          description: The connection it was learned over (RFC 5626). Empty on a single node
        path:
          type: string
          description: The RFC 3327 Path recorded at registration
