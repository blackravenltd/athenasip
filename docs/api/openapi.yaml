openapi: 3.0.3

info:
  title: AthenaSIP Admin API
  version: "1.0.0"
  description: |
    Provisioning and read-only status for one AthenaSIP node.

    Everything here goes straight to the datastore on the API's own executor. The API is
    not on the Core strand and must not be: an operator listing accounts cannot be
    allowed to hold up a call.

    Every route names the roles that admit it, and any of them does. The one credential is
    a **session token**, held by a user who logged in through `POST /auth/login`. Its
    roles are the user's, read on every request, so a role taken away takes effect on the
    next one rather than at the next login.

    There are no configured tokens. The first administrator is made on the node's host
    with `athenasip --add-user`, which is also the way back in when every password has
    been lost; everything after that is a user.

    The three refusals are distinct and a client should treat them differently. `401` is
    a credential that is absent or no longer good - an unknown token, an expired session,
    a disabled user - and is the one that means sign in again. `403` is a real credential
    that does not hold the role. `503` is the node being unable to tell, because its
    datastore did not answer; it is a retry, not a bad password.
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://{host}:{port}/api/v1
    description: A node's admin listener, as configured under `http` in config.yaml
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "8080"

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Logging in, logging out, and asking who you are
  - name: users
    description: The users that administer this node, which are not subscribers
  - name: status
    description: What this node is and whether it is serving
  - name: realms
    description: The SIP domains this node serves
  - name: accounts
    description: The accounts within a realm
  - name: registrations
    description: Where accounts are currently reachable
  - name: calls
    description: What the node is carrying now, and what its media engine relayed for it
  - name: media
    description: The media engine and the node's counters

paths:
  /health:
    get:
      operationId: getHealth
      tags: [status]
      summary: Whether this node is serving
      description: |
        Open, with no token: a container healthcheck and a load balancer reach it before
        they have any credentials to present. It says the node is up and what it is, and
        nothing about who is on it.

        `503` when the datastore is not connected, because a node that cannot read its
        own accounts cannot serve a REGISTER.
      security: []
      responses:
        "200":
          description: Serving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not serving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange a username and password for a session token
      description: |
        Open, with no credential: this is how a credential is obtained.

        The token is given out once here and is never retrievable again. The node stores
        only its SHA-256, so a dump of the datastore does not hand over live sessions.

        A user that does not exist, a password that does not verify and a user that has
        been disabled are all one answer, byte for byte, because between them the
        alternatives are a list of who holds an account on this node. An empty password is
        that same `401` rather than a `400`, so probing with one learns nothing a wrong
        password would not; a *missing* field is a `400`, because that is the caller's own
        mistake and says nothing about anybody.

        A user holding no roles may log in and is told it holds none, so a console can say
        "ask an administrator" rather than failing to load.

        There is no rate limiting yet. See `docs/authentication.md`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The username or password is not right, or the user is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the presented session
      description: |
        `204` whether or not the token named a live session: the state the caller asked
        for is that it is gone, and it is. A `404` here would be a way to ask this node
        whether a token is real, one guess at a time, on a route anybody can reach.

        Only the session presented ends. Every other session that user holds keeps
        working; `DELETE /users/{user}/sessions` is what ends all of them.
      security: []
      responses:
        "204":
          description: Gone
        "401":
          description: No bearer token was presented, so there was nothing to end
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Who this credential is and what roles it holds
      description: |
        Any signed-in user, holding any roles or none: its `username`, `display_name` and
        the `expires_at` of the session presented. `kind` is always `user`.

        The roles are resolved on this request rather than at login, so this is also how a
        client notices that its permissions have changed.
      responses:
        "200":
          description: Who you are
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /nodes:
    get:
      operationId: listNodes
      tags: [status]
      summary: The cluster as this node knows it
      description: |
        One entry per node, each with a URI per enabled SIP transport. A client reads
        this to learn where else the realm is served from, over the HTTP it is already
        speaking, which is what lets a browser fail over without DNS SRV it cannot use.

        One entry today: nothing discovers the other nodes yet, and the entry for this
        node is marked `self`.

        The address is `sip.public_address` when it is set. A node bound to `0.0.0.0`
        answers on every address it has and can name none of them to a client, so a node
        that has not been told reports what it was bound to - which an operator can see
        is unusable.
      responses:
        "200":
          description: The nodes serving this realm
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /client/config:
    get:
      tags: [status]
      operationId: getClientConfig
      summary: Everything a web client needs that it cannot be told by hand
      description: |
        A browser reads no configuration file and cannot be given one, so what it needs to
        place a call is fetched over the API it is already speaking: where to signal, and
        what to use for ICE.

        `websocket_uri` is the secure WebSocket listener, pulled out of `transports` so a
        client does not have to know that `wss` is the answer. It is **absent** when this
        node has no secure WebSocket listener, because a page served over https cannot open
        `ws://` and a browser handed one would fail later and further away.

        `ice_servers` is shaped as `RTCIceServer`, so it can be handed to
        `RTCPeerConnection` unchanged. A `turn:` entry carries a credential minted for this
        request under the coturn shared-secret scheme, which expires on its own; a `stun:`
        entry carries none, because STUN has nothing to authenticate to. A `turn:` entry
        appears without a credential when the node has no shared secret configured - the
        URL is still reported, because it is what the operator configured, but a credential
        that could not work is not invented.

        The same role as `/nodes`, and for the same reason: it is what a client reads to
        learn how to reach the realm, and it says nothing about who is on it.
      responses:
        "200":
          description: What to use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /realms:
    get:
      operationId: listRealms
      tags: [realms]
      summary: Every realm this node serves
      responses:
        "200":
          description: The realms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Realm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createRealm
      tags: [realms]
      summary: Create a realm
      description: |
        `409` when the realm already exists rather than overwriting it: create and update
        are separate operations in the datastore contract precisely so this can tell them
        apart.

        `nonce_secret` is generated when it is not given. A realm with no secret mints
        Digest nonces keyed on nothing, and it is never returned by any endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealmCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Realm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /realms/{realm}:
    parameters:
      - $ref: "#/components/parameters/Realm"
    get:
      operationId: getRealm
      tags: [realms]
      summary: One realm
      responses:
        "200":
          description: The realm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Realm"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRealm
      tags: [realms]
      summary: Update a realm
      description: |
        Only the fields given are changed. A body that leaves a field out leaves it
        alone, rather than resetting it to a default - which would be a way to lose a
        nonce secret without being told.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealmUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Realm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRealm
      tags: [realms]
      summary: Delete a realm
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /realms/{realm}/accounts:
    parameters:
      - $ref: "#/components/parameters/Realm"
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: Every account in a realm
      responses:
        "200":
          description: The accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account
      description: |
        Give a `password` and the server computes HA1 from it (RFC 2617: the hash of
        user, realm and password). That hash is the only form of the password this
        server ever holds, and no endpoint returns it.

        `ha1` is accepted instead, for importing accounts from somewhere that already
        holds one.

        The account id is derived from its URI rather than counted, so every node that
        provisions the same account agrees about which account a registration belongs to
        without a shared sequence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /realms/{realm}/accounts/{user}:
    parameters:
      - $ref: "#/components/parameters/Realm"
      - $ref: "#/components/parameters/User"
    get:
      operationId: getAccount
      tags: [accounts]
      summary: One account
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateAccount
      tags: [accounts]
      summary: Change an account's credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete an account
      description: Its registrations go with it.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /registrations:
    get:
      operationId: listRegistrations
      tags: [registrations]
      summary: Where accounts are currently reachable
      description: |
        Read only. A binding is written by a REGISTER and by nothing else.

        `flow_id` and `node_id` are the cluster half of a binding: which connection it
        was learned over (RFC 5626) and which node holds that connection. Both are empty
        on a single node.
      parameters:
        - name: realm
          in: query
          required: false
          schema:
            type: string
          description: Only this realm's registrations. Every realm when it is left out.
      responses:
        "200":
          description: The registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /calls:
    get:
      operationId: listCalls
      tags: [calls]
      summary: The calls this node is carrying now
      description: |
        Live calls only. A call that has ended is gone from this list; call records are
        Milestone 4.

        `media` is null for a call nothing anchors - the realm does not anchor, or the
        node has no media engine. Otherwise it is what the engine reports, cumulative
        since the call began. Each leg is one end of one stream as the engine sees it,
        counted at the engine in both directions: `_in` is what arrived from that end and
        `_out` what the engine sent it, so one-way audio is one of the two standing still.
        A direction the engine does not report is absent, never zero. `participant` is
        null: a relay knows an end by the address its packets come from, which behind a
        NAT is not one any participant described.
      responses:
        "200":
          description: The live calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /calls/{call}:
    parameters:
      - name: call
        in: path
        required: true
        schema:
          type: string
        description: |
          The Call-ID, percent-encoded. RFC 3261 lets a Call-ID hold `@` and `/`, and an
          encoded `/` (`%2F`) is one path segment, not two.
        example: a84b4c76e66710%40pc33.atlanta.com
    get:
      operationId: getCall
      tags: [calls]
      summary: One live call
      responses:
        "200":
          description: The call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /media:
    get:
      operationId: getMediaEngine
      tags: [media]
      summary: The media engine and what it can do
      description: Its name and capabilities, never its URL, which can carry an address and credentials.
      responses:
        "200":
          description: The engine, or null fields when the node has none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaEngine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /metrics:
    servers:
      - url: http://{host}:{port}
        variables:
          host:
            default: localhost
          port:
            default: "8080"
    get:
      operationId: getMetrics
      tags: [media]
      summary: Counters for a monitoring system
      description: |
        Prometheus text exposition format 0.0.4, on the admin port and outside `/api/v1`.

        - `athenasip_calls_active` (gauge)
        - `athenasip_dialogs_active` (gauge)
        - `athenasip_channels_open{transport}` (gauge), each flow counted once
        - `athenasip_transactions_active` (gauge)
        - `athenasip_media_packets_relayed_total` (counter), only when the media engine
          can count; absent rather than zero when it cannot
      responses:
        "200":
          description: The counters
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Every user that can administer this node
      description: Needs `manage-admin-users`. A password never appears in any of these answers.
      responses:
        "200":
          description: The users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      description: |
        Needs `manage-admin-users`. On a fresh node there are no users, so the first one
        is made on the host with `athenasip --add-user`, and that user can create the rest.

        `409` when the username is taken rather than overwriting somebody. Usernames are
        one case-folded namespace: `Tom` and `tom` cannot both exist, either spelling logs
        in, and the spelling given is kept for display.

        `400 unknown_role` for a role this build does not have. The datastore carries a
        role it does not recognise rather than dropping it - so that an older node
        rewriting a user cannot silently strip a role a newer one granted - which leaves
        this as the only place a typo can be caught.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /users/{user}:
    parameters:
      - $ref: "#/components/parameters/Username"
    get:
      operationId: getUser
      tags: [users]
      summary: One user
      description: Needs `manage-admin-users`.
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateUser
      tags: [users]
      summary: Change a user
      description: |
        Needs `manage-admin-users`. The username cannot be changed, because it is the key
        the user is filed under; the password has its own endpoint.

        A field not given is left alone. `roles` given as `[]` takes them all away, which
        is why "not given" and "given as empty" are different answers.

        `409 would_lock_out` when a user tries to disable itself or take
        `manage-admin-users` away from itself. The rule is about *self*, not about the
        role: somebody else holding it may still be disabled and demoted, and a node with
        no administrators left is recovered with `athenasip --add-user` on the host.

        Disabling a user revokes every session it held, so it stops working immediately
        rather than when each token happens to expire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The change would lock the caller out of its own account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      description: |
        Needs `manage-admin-users`. `204` with no body, `404` when there is no such user.

        Deleting a user revokes its sessions: a live token against a user that no longer
        exists is a session nobody can revoke.

        `409 would_lock_out` when a user tries to delete itself, for the same reason it
        cannot disable itself - it is locked out exactly as thoroughly either way.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A user cannot delete itself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /users/{user}/password:
    parameters:
      - $ref: "#/components/parameters/Username"
    post:
      operationId: setPassword
      tags: [users]
      summary: Set a password
      description: |
        Any authenticated caller, because "this is my own account" is not something a role
        can express.

        `old_password` is required when, and only when, the caller does **not** hold
        `manage-admin-users`. Holding that role sets anyone's password without the old
        one - including the holder's own - because the case it exists for is somebody who
        has lost theirs. So a user with no roles changing their own password must present
        it, and an administrator changing theirs need not.

        That is deliberate rather than an oversight: requiring it of a holder of
        `manage-admin-users` would not protect them, since anyone holding that role can
        already set any other administrator's password or create a new one.

        **This ends every session that user held, including the one that asked.** A
        password is changed because the old one is no longer trusted, and a session issued
        against it is exactly as untrusted; an administrator resetting a compromised
        account would otherwise leave whoever compromised it logged in. A client changing
        its own password should expect to sign in again.

        A wrong or missing `old_password` is `403 wrong_password`, not `401`. The bearer
        presented is still perfectly good - it is a field in the body that is wrong - so a
        client must not treat it as the session ending.

        Somebody else's password without the role is `403` before the datastore is asked,
        so this cannot be walked to find out who exists. With the role it is `404`,
        because by then the caller is allowed to know.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed, and every session that user held is gone
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the caller does not hold `manage-admin-users` and the `old_password`
            for its own account was wrong or missing (`wrong_password`), or this is
            somebody else's password and the caller does not hold the role (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /users/{user}/sessions:
    parameters:
      - $ref: "#/components/parameters/Username"
    delete:
      operationId: revokeSessions
      tags: [users]
      summary: Sign a user out everywhere
      description: |
        Needs `manage-admin-users`. Revokes every session that user holds, leaving the
        account alone so they can log in again.

        `204` for a user that holds none, because holding none is the state the caller
        asked for; `404` only when there is no such user.
      responses:
        "204":
          description: Every session that user held is gone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A session token from `POST /auth/login`, which resolves to the signed-in user's roles.

        A session token is 32 bytes from a CSPRNG, rendered as 64 hex characters. It is
        given out once and is never retrievable again: the node stores only its SHA-256.

  parameters:
    Realm:
      name: realm
      in: path
      required: true
      schema:
        type: string
      description: The realm name, which is the SIP domain.
      example: example.com
    Username:
      name: user
      in: path
      required: true
      schema:
        type: string
      description: |
        An administrator's username, matched case-insensitively. Not a subscriber: see the
        `users` tag.
      example: tom
    User:
      name: user
      in: path
      required: true
      schema:
        type: string
      description: |
        The user part of the account's SIP URI, percent-encoded. A user containing an `@`
        or a `/` is one path segment, not two.
      example: alice

  responses:
    BadRequest:
      description: The request was not one this API understands
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No token, or not one this node knows
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        A real credential that does not hold a role this endpoint admits. Not a reason to
        sign the user out: the credential is good, it is the permission that is missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such realm or account
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: It already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: |
        The datastore could not be asked, so the node cannot tell whether the credential
        is good. A retry rather than a bad password, and never a reason to sign a user out.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ClientConfig:
      type: object
      required: [transports, ice_servers]
      properties:
        websocket_uri:
          type: string
          description: |
            The secure WebSocket to signal over. Absent when this node has no `wss`
            listener, which a browser must treat as "there is nothing here for me".
          example: wss://203.0.113.5:9443
        transports:
          type: array
          description: Every SIP transport this node serves, the same list `/nodes` gives.
          items:
            $ref: "#/components/schemas/NodeTransport"
        ice_servers:
          type: array
          description: Shaped as `RTCIceServer`, to be handed to `RTCPeerConnection` unchanged.
          items:
            type: object
            required: [urls]
            properties:
              urls:
                type: string
                example: turn:turn.example.com:3478
              username:
                type: string
                description: |
                  Present for a `turn:` entry when a shared secret is configured. It is the
                  credential's own expiry in Unix seconds, optionally followed by a name -
                  that is the scheme, not a coincidence.
              credential:
                type: string
                description: Present with `username`. base64 of HMAC-SHA1 over it.
              expires_at:
                type: integer
                format: int64
                description: Unix seconds. The credential stops working by itself.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Matched case-insensitively
        password:
          type: string
          format: password
      example:
        username: tom
        password: a long enough password

    LoginResponse:
      type: object
      required: [token, expires_at, roles]
      properties:
        token:
          type: string
          description: |
            64 hex characters, being 32 bytes from a CSPRNG. Given out here once and never
            retrievable again; the node stores only its SHA-256.
        expires_at:
          type: integer
          format: int64
          description: |
            Unix seconds, from `http.api.session_lifetime`. The session also ends after
            `http.api.session_idle` seconds without being used, which is not reported here
            because using the session moves it.
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          description: Empty for a user that holds none, which is an answer rather than an error
      example:
        token: 3f9a1c7e2b8d4056a1c3e5f70981b2d4c6e8fa0b1d3f5a7e9920c4e6a8b0d2f41
        expires_at: 1790506751
        roles: [manage-realms]

    Session:
      type: object
      required: [kind, roles]
      description: |
        Who a credential is: always a user. `kind` is kept so a client that reads it keeps
        working, and has the one value.
      properties:
        kind:
          type: string
          enum: [user]
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        username:
          type: string
          description: In the spelling the account was created with
        display_name:
          type: string
          description: May be empty
        expires_at:
          type: integer
          format: int64
          description: Unix seconds
      example:
        kind: user
        username: Tom
        display_name: Tom Cully
        roles: [manage-realms, view-cluster-status]
        expires_at: 1790506751

    Role:
      type: string
      description: |
        A permission rather than a rank. Nothing here implies anything else: somebody who
        needs to read cluster status and manage realms is given both, and there is
        deliberately no role that covers everything.
      enum:
        - view-cluster-status
        - manage-admin-users
        - manage-realms
        - manage-realm-subscribers
        - manage-cluster

    User:
      type: object
      description: |
        A user administers this node. It is not a subscriber: a subscriber is registered
        on a realm to make and receive calls and authenticates with Digest, and neither
        credential works as the other.
      properties:
        username:
          type: string
          description: As it was given, not the case-folded key it is filed under
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
          description: A disabled user cannot log in and holds no sessions
        created_at:
          type: integer
          format: int64
          description: Unix seconds
        last_login_at:
          type: integer
          format: int64
          description: Unix seconds, `0` for a user that has never logged in
      example:
        username: Tom
        display_name: Tom Cully
        roles: [manage-admin-users]
        disabled: false
        created_at: 1790522442
        last_login_at: 0

    UserCreate:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          description: Absent means none, which is a user that may log in and do nothing

    UserUpdate:
      type: object
      description: |
        Every field is optional and one that is not given is left alone. `roles` given as
        `[]` takes them all away.
      properties:
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        disabled:
          type: boolean

    PasswordChange:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
        old_password:
          type: string
          format: password
          description: |
            Required when changing your own password *and* you do not hold
            `manage-admin-users`. Ignored when you do, because that role can set any
            password already, so asking would protect nothing.

    Error:
      type: object
      required: [error]
      description: |
        One shape for every failure. The code is for a client to branch on and does not
        change wording between releases; the message is for a person reading a log.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_json
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - method_not_allowed
                - conflict
                - datastore_error
                - unavailable
                - unknown_role
                - would_lock_out
                - wrong_password
            message:
              type: string
      example:
        error:
          code: conflict
          message: realm example.com already exists

    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        node:
          type: string
          description: This node's `sip.node_id`
        version:
          type: string
        datastore:
          type: string
          description: The datastore driver and its version, as it describes itself
      example:
        status: ok
        node: sip-0001
        version: 0.4.0
        datastore: memory 0.0.1

    Node:
      type: object
      properties:
        id:
          type: string
        self:
          type: boolean
          description: Whether this is the node that answered
        transports:
          type: array
          items:
            $ref: "#/components/schemas/NodeTransport"
      example:
        id: sip-0001
        self: true
        transports:
          - transport: wss
            address: 203.0.113.5
            port: 9500
            uri: sips:203.0.113.5:9500;transport=wss

    NodeTransport:
      type: object
      properties:
        transport:
          type: string
          enum: [udp, tcp, tls, ws, wss]
        address:
          type: string
        port:
          type: integer
        uri:
          type: string
          description: The SIP URI a client would use for this transport

    Realm:
      type: object
      properties:
        name:
          type: string
        id:
          type: integer
          format: int64
        nonce_expiry:
          type: integer
          description: How long a Digest nonce stays good, in seconds
        registration_timeout:
          type: integer
          description: The longest registration this realm grants, in seconds
        registration_minimum:
          type: integer
          description: >-
            The shortest registration this realm accepts, in seconds. Zero, the default,
            accepts any. A shorter one is refused with 423 Interval Too Brief carrying
            this value in Min-Expires (RFC 3261 10.3).
        behaviour:
          $ref: '#/components/schemas/Behaviour'
        behaviour_effective:
          $ref: '#/components/schemas/BehaviourEffective'
        behaviour_default:
          $ref: '#/components/schemas/BehaviourEffective'

    Behaviour:
      type: object
      description: >-
        What a realm does differently from the server's behaviour section. A setting
        that is null, or absent, is inherited from the server; null in an update puts
        a setting back to inheriting. An unknown setting or value is a 400 and changes
        nothing.
      additionalProperties: false
      properties:
        media_anchor:
          type: boolean
          nullable: true
          description: >-
            Whether this node puts itself in the media path when a media engine is
            configured. False leaves every session description untouched and the media
            goes end to end (RFC 3261 16.6), which is right for two endpoints that can
            reach each other and wrong for anything behind a NAT.
        media_profile:
          type: string
          nullable: true
          enum: [mirror, transport, rtp, webrtc, srtp, null]
          description: >-
            What the engine is asked to produce for a leg that has not said what it
            speaks; a leg that has is answered in kind. mirror offers a callee what the
            caller offered. transport makes ws and wss WebRTC and everything else plain
            RTP. rtp, webrtc and srtp (RFC 4568 keys in the description) make every leg
            that.

    BehaviourEffective:
      type: object
      description: >-
        A complete behaviour: in behaviour_effective, what the realm's comes to on the node
        that answered; in behaviour_default, that node's server default on its own.
      properties:
        media_anchor:
          type: boolean
        media_profile:
          type: string
          enum: [mirror, transport, rtp, webrtc, srtp]

    RealmCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        nonce_secret:
          type: string
          description: Generated when it is not given, and never returned
        nonce_expiry:
          type: integer
        registration_timeout:
          type: integer
        registration_minimum:
          type: integer
        behaviour:
          $ref: '#/components/schemas/Behaviour'

    RealmUpdate:
      type: object
      properties:
        nonce_secret:
          type: string
        nonce_expiry:
          type: integer
        registration_timeout:
          type: integer
        registration_minimum:
          type: integer
        behaviour:
          $ref: '#/components/schemas/Behaviour'

    Account:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Derived from the URI, so every node agrees on it
        uri:
          type: string
        user:
          type: string
        realm:
          type: string
      example:
        id: 11400714819323198485
        uri: sip:alice@example.com
        user: alice
        realm: example.com

    AccountCreate:
      type: object
      required: [user]
      description: One of `password` or `ha1` is required.
      properties:
        user:
          type: string
        password:
          type: string
          description: Turned into HA1 here and not stored
        ha1:
          type: string
          description: For importing an account that already has one

    AccountUpdate:
      type: object
      description: One of `password` or `ha1`.
      properties:
        password:
          type: string
        ha1:
          type: string

    Call:
      type: object
      required: [id, state, created_at, answered_at, participants, media]
      properties:
        id:
          type: string
          description: The Call-ID
        state:
          type: string
          enum: [Initial, Trying, Ringing, Connected, Closing, Closed]
        created_at:
          type: string
          format: date-time
          nullable: true
        answered_at:
          type: string
          format: date-time
          nullable: true
        participants:
          type: array
          items:
            $ref: "#/components/schemas/CallParticipant"
        media:
          allOf:
            - $ref: "#/components/schemas/CallMedia"
          nullable: true

    CallParticipant:
      type: object
      required: [identity, originator, profile]
      properties:
        identity:
          type: string
          description: The participant's SIP URI
        originator:
          type: boolean
        profile:
          type: string
          enum: [webrtc, plain-rtp, srtp-sdes]
          nullable: true
          description: What the leg's own session description said it is, null until it has said

    CallMedia:
      type: object
      required: [engine, idle_seconds, legs]
      properties:
        engine:
          type: string
          example: rtpengine
        idle_seconds:
          type: integer
          nullable: true
          description: How long all of the call's media has been silent
        legs:
          type: array
          items:
            $ref: "#/components/schemas/CallLeg"

    CallLeg:
      type: object
      required: [participant]
      properties:
        participant:
          type: integer
          nullable: true
          description: Always null today; see listCalls
        packets_in:
          type: integer
        bytes_in:
          type: integer
        packets_out:
          type: integer
        bytes_out:
          type: integer

    MediaEngine:
      type: object
      required: [engine, connected, capabilities]
      properties:
        engine:
          type: string
          nullable: true
          example: builtin
        connected:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
            enum: [bridge, conference, record, transcode]

    Registration:
      type: object
      properties:
        account:
          type: string
          description: The account's URI
        account_id:
          type: integer
          format: int64
        contact:
          type: string
        registered_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        nat:
          type: boolean
          description: The contact is on a private address, so replies go back down the flow
        node_id:
          type: string
          description: Which node holds the flow. Empty on a single node
        flow_id:
          type: string
          description: The connection it was learned over (RFC 5626). Empty on a single node
        path:
          type: string
          description: The RFC 3327 Path recorded at registration
