#
# The broker for the quickstart stack. Anonymous, which is acceptable only on a private
# compose network. Anywhere else, turn anonymous off and give each node a credential:
# the retained node status is a map of the cluster to anyone who can subscribe.

listener 1883
allow_anonymous true

# Persist retained messages (node status and wills) across a broker restart.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
