#
# The broker for the quickstart stack. Anonymous and unauthenticated, which is only
# defensible because it is on a private compose network carrying observability and
# never anything on the call setup path.
#
# A deployment that puts this broker anywhere a stranger can reach turns anonymous off
# and gives each node a credential. The retained node status says where every node is,
# which is a map of the cluster to whoever can subscribe.

listener 1883
allow_anonymous true

# Retained messages are how a monitor learns a node's state without waiting for the next
# heartbeat, and how the will reports a node that died. Persisting them means that
# survives a broker restart.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
