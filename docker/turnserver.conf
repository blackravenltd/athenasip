# TURN for browsers that cannot reach rtpengine directly. docker/up.sh renders this
# file. The node hands browsers time-limited credentials for it through
# GET /api/v1/client/config.

listening-port=3478

# The address clients are told to send to: the host's, not the container's.
external-ip=@PUBLIC_ADDRESS@

# Time-limited credentials derived from a shared secret, which must match
# http.api.turn_shared_secret in the node's configuration. Change it before this is
# reachable from anywhere you do not control.
use-auth-secret
static-auth-secret=change-me-turn-secret

realm=athenasip.local

# A narrow relay range: Docker publishes wide UDP ranges slowly. Clear of 23100-24710,
# which the unit suite binds for the builtin relay.
min-port=25100
max-port=25150

no-tls
no-dtls
no-cli
log-file=stdout

# At the default level coturn logs nothing about a refused Allocate.
verbose
