#
# TURN for the browser case: a browser behind a NAT that rtpengine cannot be reached
# through directly needs a relay it can get to, and STUN alone does not give it one.
#
# Nothing hands these credentials out yet. The node has no TURN configuration and no
# GET /api/v1/client/config to serve one from - that endpoint is a Milestone 3 item - so
# today a browser client is configured with these by hand. The shared secret below is
# the scheme that endpoint will use when it exists (RFC 5766 with the coturn
# static-auth-secret extension), so putting it here now is the thing it will read.

listening-port=3478

# The address a client is told to send to. Rendered by docker/up.sh, because a container
# address is no use to a browser on the host and useless to one on another machine.
external-ip=@PUBLIC_ADDRESS@

# Time-limited credentials derived from a shared secret rather than a username and
# password that never change. A quickstart secret, in a file everyone who clones this
# repository has: change it before this is reachable from anywhere you do not control.
use-auth-secret
static-auth-secret=change-me-turn-secret

realm=athenasip.local

# A narrow relay range, because Docker publishes a wide UDP range slowly and a quickstart
# needs very few - and clear of 23100-24710, which the unit suite binds for the builtin
# relay's own tests.
min-port=25100
max-port=25150

no-tls
no-dtls
no-cli
log-file=stdout

# Loud, because a quickstart that cannot relay is a quickstart nobody can debug, and
# coturn says nothing at all about a refused Allocate at the default level.
verbose
