#
# The end-to-end harness: one node and sipp on a network of their own.
#
#   test/e2e/run.sh
#
# runs it. The node uses memory:// and local://, so it needs no Redis and no broker.

services:
  athenasip:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: athenasip-e2e
    # Creates the harness's administrator as the node starts: on memory://, --add-user
    # creates the user and carries on serving. The password goes in on stdin.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s\n' "$$ATHENA_E2E_ADMIN_PASSWORD" > /tmp/admin-password &&
        exec /usr/local/bin/athenasip --add-user e2e-admin
        --role manage-realms --role manage-realm-subscribers --role view-cluster-status --role manage-cluster --role manage-trunks
        < /tmp/admin-password
    environment:
      ATHENA_E2E_ADMIN_PASSWORD: e2e-admin-password
    volumes:
      - ./test/e2e/config:/root/.athenasip:ro
    networks:
      e2e:
        ipv4_address: 172.31.0.10
    healthcheck:
      # Health is 503 until the datastore is connected, so no scenario starts early.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  # A call needs two ends, each registered at an address the node can route back to.
  # Started by test/e2e/run.sh with the scenario as arguments, never by "compose up".
  sipp-uas:
    build:
      context: ./test/e2e
      dockerfile: Dockerfile.sipp
    profiles: [e2e]
    volumes:
      - ./test/e2e:/e2e:ro
      - ./test/e2e/results:/results
    networks:
      e2e:
        ipv4_address: 172.31.0.20
    depends_on:
      athenasip:
        condition: service_healthy

  sipp-uac:
    build:
      context: ./test/e2e
      dockerfile: Dockerfile.sipp
    profiles: [e2e]
    volumes:
      - ./test/e2e:/e2e:ro
      - ./test/e2e/results:/results
    networks:
      e2e:
        ipv4_address: 172.31.0.21
    depends_on:
      athenasip:
        condition: service_healthy

networks:
  e2e:
    driver: bridge
    ipam:
      config:
        # Fixed addresses: a UAS registers at an address the node must route back to.
        - subnet: 172.31.0.0/24
